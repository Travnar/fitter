name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  luacheck:
    name: Luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: nebularg/actions-luacheck@v1
        with:
          files: '.'
          args: '--no-color -q'

  toc-validation:
    name: TOC validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify TOC file references exist
        run: |
          EXIT_CODE=0
          while IFS= read -r toc; do
            tocdir="$(dirname "$toc")"
            while IFS= read -r line; do
              line="$(echo "$line" | sed -e 's/\r$//' -e 's/^\xEF\xBB\xBF//')"
              [[ -z "${line// }" ]] && continue
              [[ "$line" =~ ^# ]] && continue
              filepath="$tocdir/$(echo "$line" | tr '\\' '/')"
              if [[ ! -f "$filepath" ]]; then
                echo "FAIL: $filepath listed in $toc but does not exist"
                EXIT_CODE=1
              fi
            done < "$toc"
          done < <(git ls-files '*.toc')
          exit $EXIT_CODE
