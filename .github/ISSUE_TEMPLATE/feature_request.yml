name: Feature request
description: An idea for something Fitter could do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: What you want to do in game, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Fitter to do?
      description: How you picture it working.
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Game client
      options:
        - Retail
        - World of Warcraft Forever
        - Both
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else?
      description: Workarounds you use now, other addons that do this, or screenshots.
